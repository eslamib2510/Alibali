[project]
name = "mori-receptionist"
version = "0.1.0"
description = "Multi-tenant AI receptionist for businesses (Chatwoot + Medusa + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "arq>=0.26",
  "redis>=5.0",
  "httpx>=0.27",
  "cryptography>=43.0",
  "python-dotenv>=1.0",
  "google-genai>=0.3",
  "pgvector>=0.3",
  "langgraph>=0.2",
  "langchain-google-genai>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
