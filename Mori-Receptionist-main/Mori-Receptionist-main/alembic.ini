# Alembic config for the receptionist DB.
#
# Run from this directory:
#   cd app/receptionist
#   alembic revision --autogenerate -m "<message>"   # create a migration
#   alembic upgrade head                              # apply migrations
#
# DB URL is NOT set here. env.py reads RECEPTIONIST_DATABASE_DIRECT_URL from
# the project's .env (Alembic needs the direct URL — pooled URLs break
# transactional DDL).

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
timezone = UTC

# Naming convention for autogenerated revision filenames.
# YYYY_MM_DD_HHMM-<slug>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(slug)s

# Don't truncate slugs in filenames.
truncate_slug_length = 60


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
